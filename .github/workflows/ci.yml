name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version sourced from package.json `packageManager` field (pnpm@9.12.0).
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # consent-roundtrip.test.ts's process-spawn block is skipped in CI
      # (CI=true) because spawning the real binary over a live socket flakes
      # on shared runners. Its deterministic security-boundary unit block
      # still runs. No CLI build needed for the CI test scope.
      - run: pnpm test
